<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How the agents worked</title>
<style>
  :root {
    --bg: #f5f5f5; --card: #ffffff; --text: #222222; --muted: #5f6b76; --line: #d9dde1;
    --navy: #163855; --blue: #3a6c9c; --gold: #cf8b40; --user: #e6eef6; --ok: #3c763d; --bad: #a94442;
    --code: #f0f2f4; --head-text: #ffffff; --side: #ebeef1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1721; --card: #15212e; --text: #e8ecf0; --muted: #9aa8b5; --line: #263646;
      --navy: #0b2236; --blue: #7fb0dc; --gold: #e0a35a; --user: #1c3248; --ok: #7fc47c; --bad: #e68b88;
      --code: #0e1721; --head-text: #ffffff; --side: #111c28;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 "Helvetica Neue", Helvetica, Arial, sans-serif; }
  h1 { font: normal 24px Georgia, "Palatino Linotype", Palatino, "Times New Roman", serif; margin: 0 0 4px; }
  .top { background: var(--navy); color: var(--head-text); border-bottom: 4px solid var(--gold); padding: 14px 20px 12px; }
  .top a { color: var(--head-text); }
  main { padding: 0 20px 24px; }
  .note { color: var(--muted); font-size: 13.5px; }
  #agents { background: var(--side); border: 1px solid var(--line); border-radius: 6px; padding: 0 14px 14px; margin-top: 14px; overflow-x: auto; }
  #agentgrid { display: grid; grid-template-columns: repeat(var(--cols, 1), minmax(15rem, 1fr)); column-gap: 10px; row-gap: 6px; }
  .ahead { position: sticky; top: 0; z-index: 1; background: var(--side); padding: 8px 0 6px; border-bottom: 2px solid var(--gold);
           font-weight: 600; text-transform: capitalize; }
  .acell { border-left: 3px solid var(--muted); padding: 5px 9px; background: var(--card); border-radius: 0 4px 4px 0;
           font-size: 12.5px; white-space: pre-wrap; word-break: break-word; }
  .acell.system { border-color: var(--bad); } .acell.user { border-color: var(--ok); } .acell.assistant { border-color: var(--blue); }
  .acell.tool { border-color: var(--gold); } .acell.note { border-left-style: dashed; background: none; color: var(--muted); }
  .acell.dim { opacity: .65; }
  .arole { font-weight: 600; font-size: 11.5px; color: var(--muted); }
</style>
</head>
<body>
<header class="top"><h1>How the agents worked</h1><div>One column per agent, one row per step, in the order things happened. <a id="back" href="/">Back to the chat</a></div></header>
<main>
  <p id="msg" class="note">Loading...</p>
  <section id="agents" hidden><div id="agentgrid"></div></section>
</main>
<script>
// The trace lines of one answer (/agents?session_id=...&after=a&before=b, as the chat's "See how the agents worked" link
// has them): one column per agent, one row per step, in the order things happened, so you can see who was asked what, what
// each agent found and what it passed on. Adapted from the course demo's context-panel.js; drawn from this app's trace
// events (the /progress endpoint) instead of the SDK's hooks.
const grid = document.getElementById("agentgrid"), panel = document.getElementById("agents");
const FOLD = 700;                       // longer text folds to its start, as in the demo
let columns = [], row = 1;

const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const list = (x) => [].concat(x || []);

// What one trace event draws: rows of {agent, role, label, text, dim}; none for events not worth a row
function cells(e) {
  const who = e.agent || "";
  switch (e.type) {
    case "route":
      return [{agent: "organizer", role: "user", label: "question", text: e.question},
              {agent: "organizer", role: "note", label: "routed by code", text: `${e.route}: ${list(e.agents).join(" → ")}`}];
    case "handoff":
      return [{agent: "organizer", role: "note", label: `hands over to ${e.to}`,
               text: `tools: ${list(e.tools).join(", ") || "none"}` +
                     (list(e.reads).length ? `; briefed with the reports of ${list(e.reads).join(", ")}` : "")}];
    case "handback":
      return [{agent: who, role: "assistant", label: e.ok ? `report to the organizer (${e.ms} ms)` : "failed", text: e.ok ? e.text : e.error}];
    case "agent_model":
      return [{agent: who, role: "note", label: "model",
               text: e.skipped ? `not run: ${e.reason}`
                   : `ran for ${e.ms} ms; ` + (e.fallback ? `its report was not used (${e.reason}): the code's evidence passes instead` : "its report is kept")}];
    case "message": {
      const from = list(e.from);
      return [{agent: who, role: e.role, dim: from.length > 0,
               label: e.role === "note" ? "" : (e.role === "system" ? "system prompt" : e.role) + (from.length ? ` (from ${from.join(", ")})` : ""),
               text: e.text}];
    }
    case "model_response":
      return [{agent: who, role: "assistant", label: `reply (${e.ms} ms)`,
               text: (e.content || "") + (e.nToolCalls ? `\n[asked for ${e.nToolCalls} tool call(s)]` : "") || "(no text)"}];
    case "tool_call":
      return who ? [{agent: who, role: "tool", label: `${e.name}(${Object.entries(e.args || {}).map(([k, v]) => `${k}: ${typeof v === "string" ? v : JSON.stringify(v)}`).join(", ")})`
                     + ` · ${e.ms} ms${e.ok === false ? " · error" : ""}`, text: e.result}] : [];
    case "nudge":
      return [{agent: who, role: "note", label: "", text: "Reminded to read the minutes first"}];
    case "critic":
      return [{agent: "critic", role: "note", label: `round ${e.round}`, text: e.pass ? "passed" : `found a problem: ${e.issues}`}];
    case "parallel_off":
      return [{agent: "organizer", role: "note", label: "", text: `Ran one at a time: ${e.reason}`}];
    default:
      return [];
  }
}

function column(agent) {
  let n = columns.indexOf(agent);
  if (n < 0) {
    columns.push(agent);
    n = columns.length - 1;
    const head = el("div", "ahead", agent);
    head.style.gridColumn = n + 1;
    head.style.gridRow = 1;
    grid.append(head);
    grid.style.setProperty("--cols", columns.length);
  }
  return n + 1;
}

function draw(c) {
  const cell = el("div", `acell ${c.role}${c.dim ? " dim" : ""}`);
  if (c.label) cell.append(el("div", "arole", c.label));
  const text = String(c.text ?? "");
  if (text.length > FOLD) {
    const d = el("details");
    d.append(el("summary", null, `${text.slice(0, 200)}... (${text.length} characters)`), el("pre", null, text));
    cell.append(d);
  } else {
    cell.append(text);
  }
  cell.style.gridColumn = column(c.agent || "agent");
  cell.style.gridRow = ++row;
  grid.append(cell);
}

const q = new URLSearchParams(location.search);
const sid = q.get("session_id"), range = [Number(q.get("after")), Number(q.get("before"))];
const msg = document.getElementById("msg");
if (sid) document.getElementById("back").href = "/?chat=" + encodeURIComponent(sid);
if (!sid || range.some(Number.isNaN)) {
  msg.textContent = "Open this page from \"See how the agents worked\" under an answer in the chat.";
} else {
  fetch(`/progress?session_id=${encodeURIComponent(sid)}&after=${range[0]}&before=${range[1]}`).then((r) => r.json()).then((r) => {
    r.events.forEach((e) => cells(e).forEach(draw));
    if (grid.children.length) { msg.hidden = true; panel.hidden = false; }
    else msg.textContent = "No agent steps were saved for this answer.";
  }).catch(() => { msg.textContent = "Could not load the trace."; });
}
</script>
</body>
</html>
