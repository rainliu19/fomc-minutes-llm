/* ---- the two pictures the box grid cannot draw (SVG, theme colours from the engine's CSS variables) ---- */
function svgEl(tag,attrs,text){
  var s='<'+tag; for(var k in attrs){s+=' '+k+'="'+attrs[k]+'"';}
  return s+'>'+(text===undefined?'':text)+'</'+tag+'>';
}
function T(x,y,txt,size,fill,weight,anchor){
  return svgEl('text',{x:x,y:y,style:'font-size:'+size+'px;fill:'+fill+';font-weight:'+(weight||400),'text-anchor':anchor||'start'},txt);
}
function R(x,y,w,h,fill,stroke,dash,rx){
  return svgEl('rect',{x:x,y:y,width:w,height:h,rx:rx===undefined?8:rx,style:'fill:'+fill+';stroke:'+stroke+';stroke-width:1.5'+(dash?';stroke-dasharray:'+dash:'')});
}
function L(x1,y1,x2,y2,stroke,w,dash,head){
  return svgEl('line',{x1:x1,y1:y1,x2:x2,y2:y2,style:'stroke:'+stroke+';stroke-width:'+w+(dash?';stroke-dasharray:'+dash:''),'marker-end':head?'url(#ah)':''});
}
var ARROWHEAD='<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--ink)"/></marker></defs>';
function wrapSvg(w,h,inner,label){
  return '<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" role="img" aria-label="'+label+'" style="max-width:none;font-family:inherit">'+ARROWHEAD+inner+'</svg>';
}

function layersSvg(){
  // [layer, what it adds, main key correct of 53, held-out correct of 36]
  var layers=[["Team","+ organizer, specialists and critic",50,53,36,36],
              ["One agent","+ tools, the date gate and checks",47,53,36,36],
              ["Baseline","the bare model: the question and date only",16,53,6,36]];
  var fills=["var(--new-bg)","var(--fav-bg)","var(--exists-bg)"], lines=["var(--new-bd)","var(--fav-bd)","var(--exists-bd)"];
  var s='', i, y0=[10,78,146], h=[260,182,100], x0=[10,30,50], w=[640,600,560];
  for(i=0;i<3;i++){
    s+=R(x0[i],y0[i],w[i],h[i],fills[i],lines[i]);
    s+=T(x0[i]+18,y0[i]+28,layers[i][0],17,'var(--ink)',700);
    s+=T(x0[i]+18,y0[i]+48,layers[i][1],12.5,'var(--muted)');
    var by=y0[i]+14, p=layers[i][2]/layers[i][3], q=layers[i][4]/layers[i][5];
    s+=R(690,by,220,16,'none','var(--line)','',3)+R(690,by,220*p,16,lines[i],lines[i],'',3);
    s+=T(690+220*p+8,by+13,Math.round(p*100)+'%',13,'var(--ink)',700);
    s+=R(690,by+22,220,9,'none','var(--line)','',3)+R(690,by+22,220*q,9,lines[i],lines[i],'',3);
    s+=T(690+220*q+8,by+31,Math.round(q*100)+'%',11,'var(--muted)');
  }
  s+=T(690,250,'Long bar: main key, 53 questions.',11.5,'var(--muted)')+T(690,266,'Short bar: held-out key, 36 questions.',11.5,'var(--muted)');
  var xs=[10,258,506,754], names=[["57-question key","decision cards read by code"],["Code grader","regex checks, no AI judge"],["Metrics","accuracy, errors, citations, speed"],["Evaluation page","one table per model"]];
  for(i=0;i<4;i++){
    s+=R(xs[i],318,200,62,'var(--surface)','var(--line)');
    s+=T(xs[i]+100,344,names[i][0],14,'var(--ink)',700,'middle')+T(xs[i]+100,364,names[i][1],11.5,'var(--muted)','','middle');
    if(i<3){s+=L(xs[i]+202,349,xs[i+1]-3,349,'var(--ink)',2,'',true);}
  }
  s+=T(10,404,'Every structure answers the same key; the held-out key uses meetings the main key never does.',11.5,'var(--muted)');
  return wrapSvg(960,416,s,'Three layers around the model, with accuracy bars, then the key, grader, metrics and page');
}

function lanesSvg(){
  // [name, wrong text, blocker x (null: none), blocker label, extra]
  var lanes=[["Baseline","55% wrong (34 of 62)",null,"No blocker: the arrow runs into the later facts",""],
             ["v0: guards","50% wrong (31 of 62)",700,"Date gate: a later date or unreleased minutes is refused",""],
             ["v1: guards, date check, rules","11% wrong (7 of 62)",160,"Date check in code: a later period is answered before the model is called (36 of 74 questions)","+ as-of rules in the prompt"]];
  var s='', i, y;
  for(i=0;i<3;i++){
    y=10+i*160;
    s+=T(10,y+16,lanes[i][0],15,'var(--ink)',700)+T(950,y+16,lanes[i][1],14,i===2?'var(--fav-bd)':'var(--gap-bd)',700,'end');
    s+=R(10,y+34,110,56,'var(--fav-bg)','var(--fav-bd)')+T(65,y+68,'Model',14,'var(--ink)',700,'middle');
    s+=R(300,y+34,400,56,'var(--fav-bg)','var(--fav-bd)','',0)+T(500,y+54,'data known on the as-of date',12.5,'var(--ink)','','middle');
    s+=R(700,y+34,240,56,'var(--gap-bg)','var(--gap-bd)','',0)+T(820,y+54,'facts after the as-of date',12.5,'var(--ink)','','middle');
    var bx=lanes[i][2], endX=bx===null?930:bx-4;
    s+=L(124,y+62,endX,y+62,'var(--ink)',2.5,'',true);
    if(bx===null){s+=L(952,y+24,952,y+104,'var(--line)',3,'5 5');}
    else{s+=L(bx,y+24,bx,y+104,'var(--rule-bd)',5);}
    if(i===2){   // the v1 lane keeps v0's gate behind its new line
      s+=L(700,y+24,700,y+104,'var(--rule-bd)',3,'4 4')+T(706,y+118,'v0 gate, still behind',11.5,'var(--muted)');
      s+=T(10,y+106,lanes[i][4],11.5,'var(--muted)');
    }
    s+=T(10,y+130,lanes[i][3],12,'var(--muted)');
  }
  return wrapSvg(960,500,s,'Three lanes: the model reaches for the data; a line stops the arrow earlier in each stage');
}
